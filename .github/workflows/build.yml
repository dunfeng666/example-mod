name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # 自动缓存 Gradle 与依赖；云端可正常访问 maven.neoforged.net
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle (style gate + compile + package)
        run: ./gradlew spotlessCheck build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

  gametest:
    name: GameTest (in-game tests)
    runs-on: ubuntu-latest
    # 硬质量门：游戏内测试失败即构建失败。测试类必须用 @GameTest(template=..., templateNamespace=...)
    # 指定存在的结构模板（本工程用原版 minecraft:swamp_hut），详见 references/gametest.md。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run GameTest server
        run: ./gradlew runGameTestServer --no-daemon
